name: Build SF_ExtraTools

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ARTIFACT_VERSION: "1.2.2"
  OUTPUT_NAME: "SF_ExtraTools1.2.2.jar"
  MAIN_CLASS: "me.sfiguz7.extratools.ExtraTools"
  SLIMEFUN_LEGACY_VERSION: "4.1.48"
  PAPER_VERSION: "26.2.build.111-stable"

concurrency:
  group: sf-extratools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish SF_ExtraTools1.2.2.jar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Slimefun Legacy locally
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deps
          gh release download "v${SLIMEFUN_LEGACY_VERSION}" --repo wickidcow/Slimefun-Legacy --pattern "Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" --dir .deps
          mvn -B install:install-file -Dfile=".deps/Slimefun-Legacy${SLIMEFUN_LEGACY_VERSION}.jar" -DgroupId=com.github.slimefun -DartifactId=Slimefun -Dversion="${SLIMEFUN_LEGACY_VERSION}" -Dpackaging=jar -DgeneratePom=true
      - name: Verify maintained metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.2.2</version>' pom.xml
          grep -Fq '<finalName>SF_ExtraTools${project.version}</finalName>' pom.xml
          grep -Fq '<maven.compiler.release>21</maven.compiler.release>' pom.xml
          grep -Fq 'GNU General Public License v3.0' README.md
          grep -Fq 'NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.' README.md
          grep -Fq 'COBBLED_DEEPSLATE' src/main/java/me/sfiguz7/extratools/implementation/tools/Hammer.java
          grep -Fq 'Material.TUFF' src/main/java/me/sfiguz7/extratools/implementation/machines/Pulverizer.java
      - name: Build release JAR
        run: >-
          mvn -B -Dmaven.test.skip=true clean package
          -Dpaper.version="${PAPER_VERSION}"
          -Dslimefun.groupId=com.github.slimefun
          -Dslimefun.artifactId=Slimefun
          -Dslimefun.version="${SLIMEFUN_LEGACY_VERSION}"
      - name: Stage and validate versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${OUTPUT_NAME}" "dist/${OUTPUT_NAME}"
          JAR="dist/${OUTPUT_NAME}"
          unzip -tqq "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fq "version: ${ARTIFACT_VERSION}"
          javap -verbose -classpath "$JAR" "$MAIN_CLASS" | grep -Fq 'major version: 65'
          if jar tf "$JAR" | grep -q '^io/github/thebusybiscuit/slimefun4/'; then echo 'Slimefun core classes must not be bundled.' >&2; exit 1; fi
          if jar tf "$JAR" | grep -Eqi '(^|/)net/guizhanss/guizhanlib|(^|/)guizhanlib'; then echo 'External Slimefun utility-library classes must not be bundled.' >&2; exit 1; fi
          sha256sum "$JAR"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish immutable versioned release JAR
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          EXPECTED="sha256:$(sha256sum "$JAR" | awk '{print $1}')"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq ".assets[] | select(.name == \"${OUTPUT_NAME}\") | .digest" | head -n 1 || true)"
            if [[ -n "$EXISTING" ]]; then [[ "$EXISTING" == "$EXPECTED" ]] || { echo 'Different release bytes already exist; bump version.' >&2; exit 1; }; else gh release upload "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY"; fi
          else
            gh release create "$TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SF_ExtraTools $TAG" --notes "Preservation-focused modern stone-processing pass: Hammer and Pulverizer now recognize Deepslate, Cobbled Deepslate, Tuff and Calcite while all existing items, IDs and machine behavior remain unchanged. Built against Slimefun Legacy ${SLIMEFUN_LEGACY_VERSION} / Paper ${PAPER_VERSION}."
          fi
